<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 06 - Question 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .card {
            border: 1px solid pink;
            padding: 15px;
            width: 300px;
            margin-top: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h2>Select a Book Record</h2>
    
    <label for="bookSelect">Choose a title:</label>
    <select id="bookSelect">
        <option value="">-- Select a Book --</option>
    </select>

    <div id="bookDetails" class="card" style="display: none;">
        <h3 id="bookTitle"></h3>
        <p><strong>Author:</strong> <span id="bookAuthor"></span></p>
        <p><strong>Publication Year:</strong> <span id="bookYear"></span></p>
        <p><strong>Genres:</strong> <span id="bookGenres"></span></p>
    </div>

    <script>
        // GitHub JSON URL
        const jsonUrl = "https://raw.githubusercontent.com/NaF24-SE/WebDev-Lab-6/main/book.json";

        let booksList = [];

        // Fetch JSON 
        async function fetchBooks() {
            try {

                const response = await fetch(jsonUrl);

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                booksList = data.Books;

                populateDropdown(booksList);
            } catch (error) {
                console.error("Error fetching JSON:", error);
            }
        }

        function populateDropdown(books) {
            const selectElement = document.getElementById("bookSelect");
            books.forEach(book => {
                const option = document.createElement("option");
                option.value = book.title;
                option.textContent = book.title;
                selectElement.appendChild(option);
            });
        }

        document.getElementById("bookSelect").addEventListener("change", function() {
            const selectedTitle = this.value;
            const detailsCard = document.getElementById("bookDetails");

            const foundBook = booksList.find(b => b.title === selectedTitle);

            if (foundBook) {
                document.getElementById("bookTitle").textContent = foundBook.title;
                document.getElementById("bookAuthor").textContent = foundBook.author;
                document.getElementById("bookYear").textContent = foundBook.publicationYear;
                document.getElementById("bookGenres").textContent = foundBook.genres.join(", ");
                detailsCard.style.display = "block";
            } else {
                detailsCard.style.display = "none";
            }
        });

        // Execute fetch
        fetchBooks();
    </script>

</body>
</html>
